# @map ci.check: the unit tests on Python 3.9 and 3.12, this map and the example's current, and the four implementations: built clean, against the golden answers (map, guard, coach, sessions), installed in each language and from a release
name: check
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python3 -m unittest discover -s tests -v
      - run: python3 python/map.py check
      - run: cd example && python3 ../python/map.py check
      - run: python3 tests/conformance.py
  implementations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: python3 tests/conformance.py --impl "node $PWD/node/map.mjs" --guard "node $PWD/node/map-guard.mjs"
      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache: false
      - name: go, built, vetted and formatted
        run: |
          cd go
          for b in map map-guard map-coach map-sessions; do go build -o bin/$b ./cmd/$b; done
          go vet ./...
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: python3 tests/conformance.py --impl "$PWD/go/bin/map" --guard "$PWD/go/bin/map-guard"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: rust, built and linted without a warning
        run: |
          cd rust
          RUSTFLAGS=-Dwarnings cargo build --release --locked
          cargo clippy --release --locked -- -D warnings
      - run: python3 tests/conformance.py --impl "$PWD/rust/target/release/map" --guard "$PWD/rust/target/release/map-guard"
      - name: install.sh in each language on a copy of example/, then brief, ask, build, check and the guard installed
        run: |
          for lang in python node go rust; do
            t=$RUNNER_TEMP/install-$lang
            cp -R example "$t"
            sh install.sh --lang "$lang" "$t" > "$t.log"
            cmd=$(sed -n 's/.*Its command: //p' "$t.log")
            guard=$(sed -n 's/.*install the guard: \(.*\) install <agent>\./\1/p' "$t.log")
            (cd "$t" && $cmd brief cart discount > /dev/null && $cmd ask shop.cart.totals coupon > /dev/null && $cmd build && $cmd check && $guard install claude)
          done
      - name: install.sh without Go or Rust, from a local copy of the release that release.yml publishes
        run: |
          d=$RUNNER_TEMP/release
          sh .github/pack.sh go linux x86_64 go/bin "$d"
          sh .github/pack.sh rust linux x86_64 rust/target/release "$d"
          (cd "$d" && sha256sum grepless-* > SHA256SUMS)
          python3 -m http.server 8765 --bind 127.0.0.1 --directory "$d" > /dev/null 2>&1 &
          sleep 2
          for impl in go rust; do
            t=$RUNNER_TEMP/prebuilt-$impl
            cp -R example "$t"
            env PATH=/usr/bin:/bin MAP_RELEASES=http://127.0.0.1:8765 sh install.sh --lang "$impl" "$t" | grep 'SHA-256 checked'
            (cd "$t" && tools/map build && tools/map check)
          done

# The bench area of the code map: the synthetic corpus and the benchmark of the four implementations.
# One line per component: what it is, its parts (python3 python/map.py ask <component>.<part>), its files, what it
# declares, the components it needs (imports) and those that need it, the tests that reach it (by folder)
# and the docs that name it.
# Generated by `python3 python/map.py build`; never edit it. All the areas: map.yaml.

bench:
  bench.corpus: {what: "a synthetic tagged codebase of a chosen size, the same every time, to measure and compare the implementations on", files: ["bench/corpus.py"], declares: [main, source], docs: [docs/LANGUAGES.md]}
  bench.run: {what: "the four implementations timed on the synthetic corpus, command by command, their maps compared byte for byte, the result as JSON and a table", files: ["bench/run.py"], declares: [available, timed, main], docs: [README.md, docs/LANGUAGES.md]}

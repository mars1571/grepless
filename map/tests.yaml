  tests.map: {what: "the example copied to a scratch folder, the tool run there, and the checks of each command's answer", parts: [agents, ask, brief, build, setup], files: ["tests/test_map.py"], declares: [run, Example, setUpClass, tearDownClass, test_build_and_check, test_check_fails_on_a_stale_map_and_a_broken_tag, test_ask_answers_each_kind_of_question_whole, test_a_file_without_tags_is_answered_with_its_declarations, … 7 more], tests: {tests: 1}}

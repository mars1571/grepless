# The site area of the code map: the project's page, published with GitHub Pages: what the tool is, what was measured, the quick start.
# One line per component: what it is, its parts (python3 python/map.py ask <component>.<part>), its files, what it
# declares, the components it needs (imports) and those that need it, the tests that reach it (by folder)
# and the docs that name it.
# Generated by `python3 python/map.py build`; never edit it. All the areas: map.yaml.

site:
  site.page: {what: "the project's page: its title, description, preview card and structured data for search engines", parts: [body, head], files: ["site/index.html"], docs: [PROMOTION.md]}
  site.sitemap: {what: "the page's one address, for search engines (submitted in Search Console: a project site has no robots.txt of its own)", files: ["site/sitemap.xml"], docs: [PROMOTION.md]}

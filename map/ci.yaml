# The ci area of the code map: the GitHub workflows (the checks of the four implementations, the page, the release binaries) and the git hook that keeps the map current.
# One line per component: what it is, its parts (python3 python/map.py ask <component>.<part>), its files, what it
# declares, the components it needs (imports) and those that need it, the tests that reach it (by folder)
# and the docs that name it.
# Generated by `python3 python/map.py build`; never edit it. All the areas: map.yaml.

ci:
  ci.check: {what: "the unit tests on Python 3.9 and 3.12, this map and the example's current, and the four implementations: built clean, against the golden answers (map, guard, coach, sessions), installed in each language and from a release", files: [".github/workflows/check.yml"]}
  ci.pages: {what: "the project's page published with GitHub Pages: site/, with the article's images and llms.txt copied in", files: [".github/workflows/pages.yml"]}
  ci.precommit: {what: "before each commit, the map written again from the code and added to the commit, then checked, here and in example/: a commit never carries a stale map or a broken tag", files: [".githooks/pre-commit"], docs: [AGENTS.md, README.md]}
  ci.release: {what: "on a tag v*, the four programs built in Go and in Rust for macOS, Linux and Windows, packed under stable names and published on the release with their SHA-256 sums", parts: [pack], files: [".github/pack.sh", ".github/workflows/release.yml"], docs: [docs/LANGUAGES.md]}

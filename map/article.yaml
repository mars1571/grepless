# The article area of the code map: the Medium article: its figures, the measured data they are drawn from, and the scripts that measure transcripts and draw the figures.
# One line per component: what it is, its parts (python3 python/map.py ask <component>.<part>), its files, what it
# declares, the components it needs (imports) and those that need it, the tests that reach it (by folder)
# and the docs that name it.
# Generated by `python3 python/map.py build`; never edit it. All the areas: map.yaml.

article:
  article.analysis: {what: "one project's cost of writing code: tokens of context and work time per 1,000 lines the agent wrote, read from its transcripts", parts: [lines, measure, rates, read, total, transcripts], files: ["article/analysis/rates.py", "article/analysis/transcripts.py"], declares: [opt, stamp, lines_in, session, main, read, median_by_bucket], docs: [README.md, article/README.md, article/medium.md, docs/EVIDENCE.md, llms.txt]}
  article.figures: {what: "the figures' one design, a research report's: white, grey for the sessions as they ran, one blue for the map, type sized for Medium's column", parts: [cards, composition, estimates, hook, languages, lookups, main, method, overview, problem, related, scene, style], files: ["article/src/figures.py"], declares: [esc, load, page, text, line, rect, circle, points, … 24 more], docs: [AGENTS.md, article/README.md, docs/EVIDENCE.md]}
  article.gif: {what: "a GIF written from PNG frames with no dependency: PNG decoded, one palette for every frame, only the changed rectangle of each frame stored, LZW", parts: [encode], files: ["article/src/gif.mjs"], declares: [decodePNG, palette, indexer, lzw, emit, encodeGIF], needed_by: [article.render], docs: [article/README.md]}
  article.render: {what: "every figure page rendered with Chrome: a PNG at twice its size for each figure, the preview cards at their own size, a GIF for each scene", parts: [pages], files: ["article/src/render.mjs"], needs: [article.gif], docs: [AGENTS.md, article/README.md]}

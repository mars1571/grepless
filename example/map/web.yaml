# The web area of the code map: the page that shows the cart: its script, styles and markup.
# One line per component: what it is, its parts (python3 ../python/map.py ask <component>.<part>), its files, what it
# declares, the components it needs (imports) and those that need it, the tests that reach it (by folder)
# and the docs that name it.
# Generated by `python3 ../python/map.py build`; never edit it. All the areas: map.yaml.

web:
  web.cart: {what: "the cart table and its total, aligned amounts, the coupon field", parts: [events, markup, render, styles], files: ["src/web/cart.css", "src/web/cart.js", "src/web/index.html"], declares: [render, readCoupon, wire], needs: [web.format], docs: [README.md, docs/CART.md]}
  web.format: {what: "cents as money text in the shop's currency, and a quantity with its unit", parts: [money], files: ["src/web/format.js"], declares: [money, units], needed_by: [tests.format, web.cart], tests: {tests: 1}}

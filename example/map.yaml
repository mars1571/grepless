# The map of example shop: the areas, what each needs from the others (read from imports), and where each one's map is.
# Generated by `python3 ../python/map.py build`; never edit it. `python3 ../python/map.py check` fails when it is out of date.
# An area's components, what each needs and what needs it: map/<area>.yaml.
# Reading and finding: `python3 ../python/map.py brief <words>`, then `python3 ../python/map.py ask <questions>` (AGENTS.md, "Finding code").
version: 1

areas:
  # needs: how many of its components import a component of that area; needed_by: the other way
  shop: {holds: "the cart, the prices and the discounts", components: 2, files: 2, blocks: 4, map: map/shop.yaml, needs: {}, needed_by: {tests: 1}}
  tests: {holds: "the tests of the shop and of the page", components: 2, files: 2, blocks: 3, map: map/tests.yaml, needs: {shop: 1, web: 1}, needed_by: {}}
  web: {holds: "the page that shows the cart: its script, styles and markup", components: 2, files: 4, blocks: 5, map: map/web.yaml, needs: {}, needed_by: {tests: 1}}

other:
  # files without code to read, by folder; each kind described in map.json (describe)
  ".": ["README.md", "map.json"]
  "docs/": ["CART.md"]

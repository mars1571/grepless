# The map of map: the areas, what each needs from the others (read from imports), and where each one's map is.
# Generated by `python3 python/map.py build`; never edit it. `python3 python/map.py check` fails when it is out of date.
# An area's components, what each needs and what needs it: map/<area>.yaml.
# Reading and finding: `python3 python/map.py brief <words>`, then `python3 python/map.py ask <questions>` (AGENTS.md, "Finding code").
version: 1

areas:
  # needs: how many of its components import a component of that area; needed_by: the other way
  article: {holds: "the Medium article: its figures, the measured data they are drawn from, and the scripts that measure transcripts and draw the figures", components: 4, files: 5, blocks: 21, map: map/article.yaml, needs: {}, needed_by: {}}
  bench: {holds: "the synthetic corpus and the benchmark of the four implementations", components: 2, files: 2, blocks: 2, map: map/bench.yaml, needs: {}, needed_by: {}}
  ci: {holds: "the GitHub workflows (the checks of the four implementations, the page, the release binaries) and the git hook that keeps the map current", components: 4, files: 5, blocks: 5, map: map/ci.yaml, needs: {}, needed_by: {}}
  map: {holds: "the tool in four languages: the map, ask and brief; the guard for five agents; the coach; the sessions", components: 11, files: 43, blocks: 116, map: map/map.yaml, needs: {}, needed_by: {}}
  site: {holds: "the project's page, published with GitHub Pages: what the tool is, what was measured, the quick start", components: 2, files: 2, blocks: 3, map: map/site.yaml, needs: {}, needed_by: {}}
  tests: {holds: "the unit tests and the conformance suite: the tool on the example project, the guard, the coach and the sessions on each agent's format", components: 3, files: 3, blocks: 13, map: map/tests.yaml, needs: {}, needed_by: {}}

other:
  # files without code to read, by folder; each kind described in map.json (describe)
  ".": [".gitattributes", ".gitignore", "AGENTS.md", "CITATION.cff", "CLAUDE.md", "LICENSE", "PROMOTION.md", "README.md", "llms.txt", "map.json"]
  ".claude/": ["settings.json"]
  ".codex/": ["hooks.json"]
  ".cursor/": ["hooks.json"]
  ".gemini/": ["settings.json"]
  ".github/": ["hooks/map-coach.json", "hooks/map-guard.json"]
  "agents/": ["AGENTS.md", "CLAUDE.md", "README.md"]
  "article/": {files: 29, data: 10, figure: 15, json: 2, md: 2}
  "docs/": ["COMMANDS.md", "COMPARISON.md", "CONFIG.md", "EVIDENCE.md", "LANGUAGES.md", "METHOD.md", "TAGGING.md"]
  "go/": ["go.mod"]
  "rust/": ["Cargo.lock"]
  "tests/": {files: 81, jsonl: 3, txt: 78}
